name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: python -m py_compile main.py tcc/*.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -t . -v

      - name: Compile C actions with strict warnings
        run: |
          cc -Wall -Wextra -Werror -O2 \
            csrc/main.c csrc/disk.c csrc/system.c csrc/tree.c -o tcc-c
          ./tcc-c --help
